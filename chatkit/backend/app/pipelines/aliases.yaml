# Canonical-name aliases for the pipeline lineage graph.
#
# Each key is the canonical (short, lowercase, hyphenated) name; the value
# is the list of alternate spellings we might encounter in docs, code,
# CFN stacks, Lambda names, or humans' typing. When the canonicalizer
# sees any alternate, it maps it to the canonical key.
#
# Edit this file when you notice a new nickname that a human uses for
# something the graph already knows.

