# Authoritative list of DS-owned repos the lineage crawler visits.
#
# `local_path` is where the repo is expected to live under ~/git/.
# `config_roots` are the subdirectories the config-discovery pass
# scans for .properties / .yaml / template.yaml manifests — leave
# empty to scan the whole repo (cheap for small repos).
# `pipelines` names the logical pipelines this repo contributes to,
# used as `part_of` edges in the graph.

repos:
  - name: ds-priceeye-analytics
    local_path: ~/git/ds-priceeye-analytics
    config_roots:
      - docs/config_gold_prod
    pipelines:
      - priceeye-analytics

  - name: ds-priceeye-data-collection
    local_path: ~/git/ds-priceeye-data-collection
    # config_roots: auto-discovered (repo root + docs / config / configs / resources)
    pipelines:
      - priceeye-data-collection

  - name: priceeye-scheduling
    local_path: ~/git/priceeye-scheduling
    # config_roots: auto-discovered (repo root + docs / config / configs / resources)
    pipelines:
      - priceeye-scheduling

