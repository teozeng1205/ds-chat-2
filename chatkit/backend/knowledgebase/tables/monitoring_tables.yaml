tables:
  - table_id: monitoring_provider_combined_audit
    physical_name: prod.monitoring.provider_combined_audit
    source_system: redshift
    environment: 3VDEV
    description: Provider/site level monitoring audit with issue metadata.
    primary_keys: [id]
    join_keys:
      id: id
      providercode: providercode
      sitecode: sitecode
      customer: customers
      sales_date: sales_date
    entity_columns:
      provider: providercode
      site: sitecode
      customer: customers
    partition_policy:
      partition_columns: [customers, sales_date]
      required_predicates: [customers, sales_date]
      notes: Always prune by customer + sales_date for scan efficiency.
    default_date_column: sales_date
    default_customer_column: customers
    default_limit: 100000
    tags: [monitoring, site_issues, provider]

  - table_id: monitoring_combined_audit
    physical_name: prod.monitoring.combined_audit
    source_system: redshift
    environment: 3VDEV
    description: Request-level monitoring audit records.
    primary_keys: [id]
    join_keys:
      id: id
      providercode: providercode
      sitecode: sitecode
      customer: customers
      sales_date: sales_date
    entity_columns:
      provider: providercode
      site: sitecode
      customer: customers
    partition_policy:
      partition_columns: [sales_date]
      required_predicates: [sales_date]
      notes: sales_date partition required.
    default_date_column: sales_date
    default_limit: 100000
    tags: [monitoring, requests]

  - table_id: analytics_market_level_anomalies_v3
    physical_name: prod.analytics.market_level_anomalies_v3
    source_system: redshift
    environment: 3VDEV
    description: Market-level anomaly signals partitioned by sales_date and customer.
    primary_keys: [observation_date, mkt, seg, customer]
    join_keys:
      customer: customer
      sales_date: sales_date
    entity_columns:
      customer: customer
    partition_policy:
      partition_columns: [customer, sales_date]
      required_predicates: [customer, sales_date]
      notes: Query requires customer and sales_date filters.
    default_date_column: sales_date
    default_customer_column: customer
    default_limit: 50000
    tags: [analytics, anomalies]

  - table_id: priceeye_provider
    physical_name: priceeye.provider
    source_system: mysql
    environment: 3VDEV
    description: Provider master code lookup.
    partition_policy:
      partition_columns: []
      required_predicates: []
    entity_columns:
      provider: providercode
    tags: [lookup, mysql]

  - table_id: priceeye_site
    physical_name: priceeye.site
    source_system: mysql
    environment: 3VDEV
    description: Site master code lookup.
    partition_policy:
      partition_columns: []
      required_predicates: []
    entity_columns:
      site: sitecode
    tags: [lookup, mysql]

  - table_id: priceeye_customer
    physical_name: priceeye.customer
    source_system: mysql
    environment: 3VDEV
    description: Customer master code lookup.
    partition_policy:
      partition_columns: []
      required_predicates: []
    entity_columns:
      customer: customer
    tags: [lookup, mysql]

  - table_id: collection_anomalies_s3
    physical_name: s3://s3-atp-3victors-3vdev-use1-collection-anomalies/
    source_system: s3
    environment: 3VDEV
    description: Collection anomaly exports stored in S3 (parquet/csv).
    partition_policy:
      partition_columns: [sales_date]
      required_predicates: [sales_date]
      notes: Prefix partitioned by YYYY/MM/DD hierarchy.
    default_date_column: sales_date
    default_limit: 200000
    tags: [s3, anomalies]
