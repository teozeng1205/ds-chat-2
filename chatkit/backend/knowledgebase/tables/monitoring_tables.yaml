tables:
- table_id: monitoring_provider_combined_audit
  physical_name: prod.monitoring.provider_combined_audit
  source_system: redshift
  environment: 3VDEV
  description: 'Provider/site level monitoring audit with issue metadata. Columns(52):
    id, customers, crawl_start_date, scheduledate, scheduletime, actualscheduletimestamp.
    Partition keys: sales_date.'
  primary_keys:
  - id
  join_keys:
    id: id
    providercode: providercode
    sitecode: sitecode
    customer: customers
    sales_date: sales_date
    provider: providercode
    site: sitecode
  entity_columns:
    provider: providercode
    site: sitecode
    customer: customers
  partition_policy:
    partition_columns:
    - sales_date
    required_predicates:
    - sales_date
    notes: 'Catalog partitions: 389. Samples: ["20250824"], ["20251113"], ["20251030"].
      Location: s3://s3-atp-3victors-3vdev-use1-provider-monitor/v1/provider-combined-audit/.'
  default_date_column: sales_date
  default_customer_column: customers
  default_limit: 100000
  tags:
  - monitoring
  - site_issues
  - provider
  - partition-checked
