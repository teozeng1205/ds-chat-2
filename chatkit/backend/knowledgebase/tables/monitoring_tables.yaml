- table_id: analytics_market_level_anomalies_v3
  physical_name: prod.analytics.market_level_anomalies_v3
  source_system: redshift
  environment: 3VDEV
  description: 'Market-level anomaly signals partitioned by sales_date and customer.
    Columns(58): observation_date, mkt, seg, region_name, depart_period, carrier_group.
    Partition keys: customer, sales_date.'
  primary_keys:
  - observation_date
  - mkt
  - seg
  - customer
  join_keys:
    customer: customer
    sales_date: sales_date
  entity_columns:
    customer: customer
  partition_policy:
    partition_columns:
    - customer
    - sales_date
    required_predicates:
    - customer
    - sales_date
    notes: 'Catalog partitions: 333. Samples: ["AS","20250915"], ["B6","20251212"],
      ["INS","20250923"]. Location: s3://s3-atp-3victors-3vdev-use1-anomaly-datasets/market-level/v3/.'
  default_date_column: sales_date
  default_customer_column: customer
  default_limit: 50000
  tags:
  - analytics
  - anomalies
  - partition-checked
