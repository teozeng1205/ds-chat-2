tables:
- table_id: monitoring_provider_combined_audit
  physical_name: prod.monitoring.provider_combined_audit
  source_system: redshift
  environment: 3VDEV
  description: 'Provider/site level monitoring audit with issue metadata Key columns:
    id, customers, crawl_start_date, scheduledate, scheduletime, actualscheduletimestamp....'
  primary_keys:
  - id
  join_keys:
    id: id
    providercode: providercode
    sitecode: sitecode
    customer: customers
    sales_date: sales_date
  entity_columns:
    provider: providercode
    site: sitecode
    customer: customers
  partition_policy:
    partition_columns:
    - sales_date
    required_predicates:
    - sales_date
    notes: Partition audit shows sales_date as external partition key; add customer filters when available for additional pruning.
  default_date_column: sales_date
  default_customer_column: customers
  default_limit: 100000
  tags:
  - monitoring
  - site_issues
  - provider
- table_id: monitoring_combined_audit
  physical_name: prod.monitoring.combined_audit
  source_system: redshift
  environment: 3VDEV
  description: 'Request-level monitoring audit records Key columns: id, inputrequestid,
    customer, customercollectionid, customercollectionname, reference....'
  primary_keys:
  - id
  join_keys:
    id: id
    providercode: providercode
    sitecode: sitecode
    customer: customers
    sales_date: sales_date
  entity_columns:
    provider: providercode
    site: sitecode
    customer: customers
  partition_policy:
    partition_columns:
    - sales_date
    required_predicates:
    - sales_date
    notes: sales_date partition required.
  default_date_column: sales_date
  default_limit: 100000
  tags:
  - monitoring
  - requests
- table_id: analytics_market_level_anomalies_v3
  physical_name: prod.analytics.market_level_anomalies_v3
  source_system: redshift
  environment: 3VDEV
  description: 'Market-level anomaly signals partitioned by sales_date and customer
    Key columns: observation_date, mkt, seg, region_name, depart_period, carrier_group....'
  primary_keys:
  - observation_date
  - mkt
  - seg
  - customer
  join_keys:
    customer: customer
    sales_date: sales_date
  entity_columns:
    customer: customer
  partition_policy:
    partition_columns:
    - customer
    - sales_date
    required_predicates:
    - customer
    - sales_date
    notes: Query requires customer and sales_date filters.
  default_date_column: sales_date
  default_customer_column: customer
  default_limit: 50000
  tags:
  - analytics
  - anomalies
- table_id: priceeye_provider
  physical_name: priceeye.provider
  source_system: mysql
  environment: 3VDEV
  description: 'Provider master table with integration type, queue, connectivity and
    status fields Key columns: provider_code, provider_name, type, blacklist_days,
    max_connections, hostname....'
  partition_policy:
    partition_columns: []
    required_predicates: []
  entity_columns:
    provider: provider_code
  tags:
  - lookup
  - mysql
  primary_keys:
  - provider_code
  join_keys:
    provider_code: provider_code
- table_id: priceeye_site
  physical_name: priceeye.site
  source_system: mysql
  environment: 3VDEV
  description: 'Provider site table keyed by provider_code + site_code; includes POS/type/retry/status
    settings Key columns: provider_code, site_code, site_name, pos, type, provider_properties....'
  partition_policy:
    partition_columns: []
    required_predicates: []
  entity_columns:
    provider: provider_code
    site: site_code
  tags:
  - lookup
  - mysql
  primary_keys:
  - provider_code
  - site_code
  join_keys:
    provider_code: provider_code
    site_code: site_code
- table_id: priceeye_customer
  physical_name: priceeye.customer
  source_system: mysql
  environment: 3VDEV
  description: 'Customer master table with timezone/status/customer_type; canonical
    code column is name Key columns: name, description, status, customer_type, timezone,
    industry_vertical....'
  partition_policy:
    partition_columns: []
    required_predicates: []
  entity_columns:
    customer: name
  tags:
  - lookup
  - mysql
  primary_keys:
  - name
  join_keys:
    customer: name
  default_customer_column: name
- table_id: collection_anomalies_s3
  physical_name: s3://s3-atp-3victors-3vdev-use1-collection-anomalies/
  source_system: s3
  environment: 3VDEV
  description: Collection anomaly exports stored in S3 (parquet/csv).
  partition_policy:
    partition_columns:
    - sales_date
    required_predicates:
    - sales_date
    notes: Prefix partitioned by YYYY/MM/DD hierarchy.
  default_date_column: sales_date
  default_limit: 200000
  tags:
  - s3
  - anomalies
