tables:
- table_id: analytics_market_level_anomalies
  physical_name: prod.analytics.market_level_anomalies
  source_system: redshift
  environment: 3VDEV
  description: 'Spark-produced market-level anomalies fact table. Columns(19): segment_name,
    competitive_position, metro_market, region_name, depart_period, carrier_group.
    Partition keys: sales_date, customer.'
  entity_columns:
    customer: customer
  partition_policy:
    partition_columns:
    - sales_date
    - customer
    required_predicates:
    - customer
    - sales_date
    notes: 'Catalog partitions: 3467. Samples: ["20250309","SK"], ["20250325","B6"],
      ["20250418","CH"]. Location: s3://s3-atp-3victors-3vdev-use1-anomaly-datasets/market-level/v1/.'
  default_date_column: sales_date
  default_customer_column: customer
  default_limit: 50000
  tags:
  - analytics
  - anomalies
  - market
  - partition-checked
  join_keys:
    customer: customer
    sales_date: sales_date
